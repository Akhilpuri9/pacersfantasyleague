<title>Pacers Fantasy League</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap');
  :root {
    --bg: #080c14;
    --bg2: #0d1420;
    --bg3: #121a2a;
    --card: #0f1928;
    --card2: #162135;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --gold: #f0b429;
    --gold2: #d99f1e;
    --gold-glow: rgba(240,180,41,0.15);
    --teal: #00c9a7;
    --teal2: #00a88c;
    --red: #f05252;
    --green: #22c55e;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --text: #e8edf5;
    --muted: #6b7a99;
    --muted2: #4a5568;
    --accent-line: rgba(240,180,41,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }

  /* ── NAV ── */
  nav {
    background: rgba(13,20,32,0.95);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px; position: sticky; top:0; z-index:100;
  }
  nav::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--teal), transparent);
  }
  .logo { font-family:'Bebas Neue',sans-serif; display:flex; align-items:center; gap:0.75rem; text-decoration:none; }
  .logo-img { width:36px; height:36px; object-fit:contain; }
  .logo-text { display:flex; flex-direction:column; line-height:1; }
  .logo-text-main { font-size:1.35rem; letter-spacing:3px; color:var(--gold); }
  .logo-text-sub { font-size:0.72rem; letter-spacing:4px; color:var(--teal); opacity:0.9; font-family:'Inter',sans-serif; font-weight:300; text-transform:uppercase; margin-top:1px; }
  .nav-right { display:flex; align-items:center; gap:1rem; }
  .nav-user { font-size:0.82rem; color:var(--muted); }
  .nav-user strong { color:var(--text); font-weight:500; }

  /* ── BUTTONS ── */
  .btn { padding:0.5rem 1.25rem; border-radius:8px; border:none; cursor:pointer; font-family:'Inter',sans-serif; font-size:0.875rem; font-weight:500; transition:all 0.2s; letter-spacing:0.2px; }
  .btn-gold { background:var(--gold); color:#000; font-weight:600; }
  .btn-gold:hover { background:var(--gold2); transform:translateY(-1px); }
  .btn-outline { background:transparent; border:1px solid var(--border2); color:var(--text); }
  .btn-outline:hover { background:var(--bg3); border-color:var(--gold); color:var(--gold); }
  .btn-teal { background:var(--teal); color:#000; font-weight:600; }
  .btn-teal:hover { background:var(--teal2); }
  .btn-danger { background:var(--red); color:#fff; }
  .btn-sm { padding:0.3rem 0.9rem; font-size:0.78rem; }
  .btn:disabled { opacity:0.35; cursor:not-allowed; transform:none !important; }

  /* ── PAGES ── */
  .page { display:none; }
  .page.active { display:block; }

  /* ── AUTH ── */
  #auth-page {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(240,180,41,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(0,201,167,0.06) 0%, transparent 70%), var(--bg);
  }
  .auth-box {
    background: var(--card); border:1px solid var(--border2);
    border-radius:20px; padding:2.5rem; width:100%; max-width:420px;
    box-shadow: 0 0 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(240,180,41,0.08);
  }
  .auth-box h1 { font-family:'Bebas Neue',sans-serif; font-size:2.2rem; color:var(--gold); text-align:center; letter-spacing:2px; margin-bottom:0.25rem; }
  .auth-box p { text-align:center; color:var(--muted); font-size:0.875rem; margin-bottom:2rem; }
  .form-group { margin-bottom:1rem; }
  .form-group label { display:block; font-size:0.72rem; color:var(--muted); margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:1px; font-weight:500; }
  .form-group input { width:100%; background:var(--bg3); border:1px solid var(--border2); border-radius:10px; padding:0.7rem 1rem; color:var(--text); font-size:0.9rem; outline:none; transition:all 0.2s; }
  .form-group input:focus { border-color:var(--gold); background:rgba(240,180,41,0.04); }
  .auth-tabs { display:flex; border-bottom:1px solid var(--border); margin-bottom:1.5rem; }
  .auth-tab { flex:1; padding:0.75rem; background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.9rem; transition:all 0.2s; font-family:'Inter',sans-serif; }
  .auth-tab.active { color:var(--gold); border-bottom:2px solid var(--gold); }
  .error-msg { border-radius:10px; padding:0.75rem; font-size:0.82rem; margin-bottom:1rem; display:none; border:1px solid rgba(240,82,82,0.3); background:rgba(240,82,82,0.08); color:var(--red); }

  /* ── APP WRAPPER ── */
  #app-page { min-height:100vh; }
  #app-content { max-width:1200px; margin:0 auto; padding:1.5rem; }

  /* ── TABS ── */
  .tabs { display:flex; gap:0; margin-bottom:2rem; border-bottom:1px solid var(--border); overflow-x:auto; }
  .tab { padding:0.75rem 1.4rem; background:none; border:none; color:var(--muted); cursor:pointer; font-size:0.875rem; font-weight:500; border-bottom:2px solid transparent; transition:all 0.2s; margin-bottom:-1px; white-space:nowrap; font-family:'Inter',sans-serif; letter-spacing:0.3px; }
  .tab:hover { color:var(--text); }
  .tab.active { color:var(--gold); border-bottom-color:var(--gold); }

  /* ── CARDS ── */
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
  .card-title { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:600; margin-bottom:1rem; color:var(--text); letter-spacing:0.5px; }

  /* ── MATCH CARDS ── */
  .match-card {
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:1.25rem; margin-bottom:0.875rem;
    cursor:pointer; transition:all 0.2s; position:relative; overflow:hidden;
  }
  .match-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--gold), var(--teal));
    opacity:0; transition:opacity 0.2s;
  }
  .match-card:hover { border-color:rgba(240,180,41,0.3); transform:translateY(-2px); background:var(--card2); }
  .match-card:hover::before { opacity:1; }
  .match-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.75rem; }
  .match-teams { font-family:'Rajdhani',sans-serif; font-size:1.25rem; font-weight:700; letter-spacing:0.5px; }
  .match-teams .vs { color:var(--muted2); font-size:0.85rem; margin:0 0.5rem; }
  .match-status { font-size:0.7rem; padding:0.25rem 0.75rem; border-radius:20px; font-weight:600; letter-spacing:0.5px; text-transform:uppercase; }
  .status-live { background:rgba(34,197,94,0.15); color:var(--green); border:1px solid rgba(34,197,94,0.3); animation:pulse-live 2s infinite; }
  @keyframes pulse-live { 0%,100%{opacity:1} 50%{opacity:0.7} }
  .status-upcoming { background:rgba(240,180,41,0.12); color:var(--gold); border:1px solid rgba(240,180,41,0.25); }
  .status-completed { background:rgba(107,122,153,0.12); color:var(--muted); border:1px solid rgba(107,122,153,0.2); }
  .match-meta { font-size:0.78rem; color:var(--muted); display:flex; gap:1.25rem; flex-wrap:wrap; }
  .match-score { margin-top:0.75rem; font-family:'Rajdhani',sans-serif; font-size:1rem; color:var(--teal); font-weight:600; }
  .my-team-badge { font-size:0.72rem; color:var(--green); margin-top:0.5rem; font-weight:500; }

  /* ── SETUP BANNER ── */
  .setup-banner { background:rgba(240,180,41,0.06); border:1px solid rgba(240,180,41,0.25); border-radius:12px; padding:1rem 1.25rem; margin-bottom:1.5rem; font-size:0.84rem; line-height:1.7; }
  .setup-banner code { background:var(--bg3); padding:0.15rem 0.5rem; border-radius:5px; font-size:0.78rem; color:var(--teal); }

  /* ── SECTION TITLE ── */
  .section-title { font-family:'Rajdhani',sans-serif; font-size:1.4rem; font-weight:700; margin-bottom:1.25rem; color:var(--text); letter-spacing:0.5px; }

  /* ── BADGES ── */
  .badge { font-size:0.68rem; padding:0.2rem 0.55rem; border-radius:5px; font-weight:600; }
  .badge-green { background:rgba(34,197,94,0.15); color:var(--green); }
  .badge-gold { background:rgba(240,180,41,0.15); color:var(--gold); }

  /* ── TEAM BUILDER ── */
  .pitch-visual { background:var(--card); border-radius:14px; padding:1.5rem; border:1px solid var(--border); }
  .pitch-section { margin-bottom:1.5rem; }
  .pitch-section-label { font-size:0.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:0.75rem; text-align:center; font-weight:600; }
  .player-slots { display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center; }
  .player-slot { width:72px; text-align:center; }
  .player-avatar { width:48px; height:48px; border-radius:50%; background:var(--bg3); border:2px solid var(--border2); display:flex; align-items:center; justify-content:center; margin:0 auto 0.3rem; font-size:0.7rem; font-weight:600; cursor:pointer; transition:all 0.2s; position:relative; letter-spacing:0.5px; color:var(--muted); }
  .player-avatar.filled { border-color:var(--teal); background:rgba(0,201,167,0.1); color:var(--teal); }
  .player-avatar.captain { border-color:var(--gold); background:rgba(240,180,41,0.12); color:var(--gold); box-shadow:0 0 12px rgba(240,180,41,0.2); }
  .player-avatar.vice-captain { border-color:var(--blue); background:rgba(96,165,250,0.1); color:var(--blue); }
  .player-avatar .badge { position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%; font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .badge-c { background:var(--gold); color:#000; }
  .badge-vc { background:var(--blue); color:#fff; }
  .player-slot-name { font-size:0.65rem; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .team-builder { display:grid; grid-template-columns:1fr 340px; gap:1.5rem; }
  @media(max-width:768px){.team-builder{grid-template-columns:1fr;}}
  .selection-bar { background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:0.75rem 1rem; margin-bottom:1rem; display:flex; justify-content:space-between; align-items:center; font-size:0.82rem; gap:0.5rem; flex-wrap:wrap; }
  .sel-count { color:var(--muted); }
  .sel-count strong { color:var(--text); }

  /* ── PLAYER LIST ── */
  .player-list-panel { background:var(--card); border-radius:14px; border:1px solid var(--border); overflow:hidden; }
  .player-list-header { padding:0.75rem 1rem; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; gap:0.5rem; flex-wrap:wrap; }
  .player-filter-tabs { display:flex; gap:0.3rem; flex-wrap:wrap; }
  .filter-tab { padding:0.3rem 0.65rem; border-radius:6px; font-size:0.72rem; background:none; border:1px solid var(--border); color:var(--muted); cursor:pointer; transition:all 0.2s; font-family:'Inter',sans-serif; font-weight:500; }
  .filter-tab.active { background:var(--gold); border-color:var(--gold); color:#000; font-weight:600; }
  .player-item { display:flex; align-items:center; gap:0.75rem; padding:0.75rem 1rem; border-bottom:1px solid var(--border); cursor:pointer; transition:background 0.15s; }
  .player-item:hover:not(.disabled) { background:var(--bg3); }
  .player-item.selected { background:rgba(0,201,167,0.05); }
  .player-item.disabled { opacity:0.35; cursor:not-allowed; }
  .player-info { flex:1; min-width:0; }
  .player-name { font-size:0.875rem; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-team { font-size:0.72rem; color:var(--muted); margin-top:1px; }
  .player-role { font-size:0.68rem; padding:0.15rem 0.5rem; border-radius:4px; background:var(--bg3); color:var(--muted); font-weight:600; letter-spacing:0.3px; }
  .player-pts { font-size:0.8rem; color:var(--gold); font-weight:600; margin-top:0.2rem; }
  .player-check { width:18px; height:18px; border-radius:50%; border:2px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:10px; flex-shrink:0; transition:all 0.15s; }
  .player-check.checked { background:var(--teal); border-color:var(--teal); color:#000; font-weight:700; }

  /* ── LEADERBOARD ── */
  .leaderboard-table { width:100%; border-collapse:collapse; }
  .leaderboard-table th { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; padding:0.6rem 0.75rem; text-align:left; border-bottom:1px solid var(--border); font-weight:500; }
  .leaderboard-table td { padding:0.75rem; border-bottom:1px solid var(--border); font-size:0.875rem; }
  .leaderboard-table tr:last-child td { border-bottom:none; }
  .leaderboard-table tr:hover td { background:var(--bg3); }
  .rank-badge { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.72rem; font-weight:700; }
  .rank-1 { background:var(--gold); color:#000; }
  .rank-2 { background:#c0c0c0; color:#000; }
  .rank-3 { background:#cd7f32; color:#fff; }
  .rank-other { background:var(--bg3); color:var(--muted); }
  .me-row td { background:rgba(0,201,167,0.04) !important; }

  /* ── GROUPS ── */
  .group-card { background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:1.25rem; margin-bottom:1rem; }
  .group-code { font-family:'Bebas Neue',sans-serif; font-size:2rem; color:var(--gold); letter-spacing:4px; }
  .member-chip { display:inline-flex; align-items:center; gap:0.35rem; background:var(--bg3); border:1px solid var(--border); border-radius:20px; padding:0.3rem 0.75rem; font-size:0.78rem; margin:0.25rem; }

  /* ── LIVE SCORE ── */
  .live-score-box { background:rgba(34,197,94,0.04); border:1px solid rgba(34,197,94,0.18); border-radius:14px; padding:1.25rem; }
  .score-team { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; }
  .score-val { font-family:'Bebas Neue',sans-serif; font-size:2rem; color:var(--green); letter-spacing:1px; }
  .score-overs { font-size:0.78rem; color:var(--muted); }

  /* ── TEAM DISPLAY ── */
  .team-display { background:var(--card); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .team-display-header { background:rgba(240,180,41,0.05); border-bottom:1px solid var(--border); padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; }
  .team-display-header h3 { font-family:'Rajdhani',sans-serif; font-size:1.1rem; color:var(--green); }
  .team-grid { padding:1rem; }
  .cap-badge { font-size:0.62rem; font-weight:700; background:var(--gold); color:#000; padding:1px 5px; border-radius:4px; }
  .vc-badge { font-size:0.62rem; font-weight:700; background:var(--blue); color:#fff; padding:1px 5px; border-radius:4px; }

  /* ── CAPTAIN MODAL ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--card2); border:1px solid var(--border2); border-radius:18px; padding:1.5rem; width:100%; max-width:420px; }
  .modal h3 { font-family:'Rajdhani',sans-serif; font-size:1.2rem; margin-bottom:1rem; color:var(--text); letter-spacing:0.5px; }

  /* ── SPINNER ── */
  .spinner { width:32px; height:32px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; margin:2rem auto; }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── TOAST ── */
  .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--card2); border:1px solid var(--border2); border-radius:12px; padding:0.75rem 1.25rem; font-size:0.875rem; z-index:999; transform:translateY(100px); transition:transform 0.3s; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
  .toast.show { transform:translateY(0); }
  .toast.success { border-color:rgba(34,197,94,0.4); color:var(--green); }
  .toast.error { border-color:rgba(240,82,82,0.4); color:var(--red); }

  /* ── RULES PAGE ── */
  .rules-page { max-width:900px; margin:0 auto; }
  .rules-hero { text-align:center; padding:2.5rem 1rem; margin-bottom:2rem; position:relative; }
  .rules-hero-title { font-family:'Bebas Neue',sans-serif; font-size:3rem; color:var(--gold); letter-spacing:4px; position:relative; }
  .rules-hero-sub { color:var(--muted); font-size:0.9rem; margin-top:0.5rem; letter-spacing:1px; position:relative; }
  .rules-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:2.5rem; }
  .rules-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
  .rules-card-icon { font-size:1.75rem; margin-bottom:0.75rem; }
  .rules-card-title { font-family:'Rajdhani',sans-serif; font-size:1.05rem; font-weight:700; color:var(--gold); margin-bottom:0.75rem; letter-spacing:0.5px; }
  .rules-list { list-style:none; padding:0; }
  .rules-list li { font-size:0.84rem; color:var(--muted); padding:0.3rem 0; padding-left:1rem; position:relative; line-height:1.5; }
  .rules-list li::before { content:'›'; position:absolute; left:0; color:var(--teal); font-weight:700; }
  .rules-list li strong { color:var(--text); font-weight:500; }
  .rules-section-title { font-family:'Bebas Neue',sans-serif; font-size:1.6rem; letter-spacing:3px; color:var(--text); margin-bottom:1.25rem; }
  .points-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-bottom:2rem; }
  .points-table-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; }
  .points-table-title { font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700; color:var(--teal); margin-bottom:0.75rem; letter-spacing:0.5px; }
  .points-table { width:100%; border-collapse:collapse; }
  .points-table td { padding:0.35rem 0.25rem; font-size:0.8rem; color:var(--muted); border-bottom:1px solid rgba(255,255,255,0.04); }
  .pts-val { text-align:right; color:var(--green); font-weight:600; white-space:nowrap; }

  /* ── OVERVIEW ── */
  .overview-welcome { font-size:1.5rem; font-weight:300; color:var(--muted); margin-bottom:1.5rem; }
  .overview-name { color:var(--text); font-weight:600; }
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
  .stat-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; text-align:center; transition:all 0.2s; }
  .stat-icon { font-size:1.6rem; margin-bottom:0.5rem; }
  .stat-value { font-family:'Bebas Neue',sans-serif; font-size:2rem; letter-spacing:1px; line-height:1; margin-bottom:0.3rem; }
  .stat-label { font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; font-weight:500; }
  .overview-section-title { font-family:'Rajdhani',sans-serif; font-size:1.05rem; font-weight:700; color:var(--muted); letter-spacing:2px; text-transform:uppercase; margin:1.75rem 0 1rem; }
  .upcoming-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; margin-bottom:1rem; }
  .upcoming-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.1rem; cursor:pointer; transition:all 0.2s; }
  .quick-actions { display:flex; gap:0.75rem; flex-wrap:wrap; }
  .quick-btn { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:0.65rem 1.25rem; color:var(--text); font-size:0.85rem; cursor:pointer; transition:all 0.2s; }
</style>
</head>
<body>

<div id="auth-page">
  <div class="auth-box">
    <h1>Pacers Fantasy League</h1>
    <p>Sign in to play</p>
    <div id="auth-error" class="error-msg"></div>
    <div class="form-group"><label>Email</label><input type="email" id="login-email"></div>
    <div class="form-group"><label>Password</label><input type="password" id="login-password"></div>
    <button class="btn btn-gold" style="width:100%" onclick="doLogin()">Sign In</button>
  </div>
</div>

<div id="app-page" style="display:none">
  <nav>
    <div class="logo"><div class="logo-text"><span class="logo-text-main">PACERS</span><span class="logo-text-sub">Fantasy League</span></div></div>
    <div class="nav-right">
      <span class="nav-user">Welcome, <strong id="nav-username">Player</strong></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <div id="app-content">
    <div class="tabs">
      <button class="tab active" data-tab="overview" onclick="showTab('overview')">🏡 Overview</button>
      <button class="tab" data-tab="matches" onclick="showTab('matches')">🏏 Matches</button>
      <button class="tab" data-tab="myteams" onclick="showTab('myteams')">👤 My Teams</button>
      <button class="tab" data-tab="leaderboard" onclick="showTab('leaderboard')">🏆 Leaderboard</button>
      <button class="tab" data-tab="rules" onclick="showTab('rules')">📖 Rules</button>
    </div>

    <div id="tab-overview" class="tab-content"></div>

    <div id="tab-matches" class="tab-content" style="display:none">
      <div id="matches-container"></div>
    </div>

    <div id="tab-myteams" class="tab-content" style="display:none">
      <div id="myteams-container"></div>
    </div>

    <div id="tab-leaderboard" class="tab-content" style="display:none">
      <div id="leaderboard-container"></div>
    </div>

    <div id="tab-rules" class="tab-content" style="display:none">
      <div class="rules-page">
        <div class="rules-hero"><div class="rules-hero-title">How to Play</div></div>
        <div class="rules-grid">
            <div class="rules-card">
                <div class="rules-card-title">Team Rules</div>
                <ul class="rules-list">
                    <li>Pick <strong>11 players</strong></li>
                    <li>Max <strong>7 players</strong> from one team</li>
                    <li>Select Captain (2x) and Vice-Captain (1.5x)</li>
                </ul>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="match-detail-overlay" style="display:none" class="modal-overlay">
  <div class="modal" style="max-width:600px">
    <h2 id="detail-match-title" style="font-family:'Rajdhani'; margin-bottom:1rem"></h2>
    <div id="match-detail-content"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:1rem" onclick="document.getElementById('match-detail-overlay').style.display='none'">Close</button>
  </div>
</div>

<div id="team-builder-overlay" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:300; padding:1.5rem; overflow-y:auto">
    <div style="max-width:1100px; margin:0 auto">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem">
            <h2 id="builder-match-title" style="font-family:'Rajdhani'"></h2>
            <button class="btn btn-outline btn-sm" onclick="closeTeamBuilder()">Cancel</button>
        </div>
        <div class="team-builder">
            <div class="pitch-visual">
                <div class="player-slots" id="slot-wk"></div>
                <div class="player-slots" id="slot-bat"></div>
                <div class="player-slots" id="slot-ar"></div>
                <div class="player-slots" id="slot-bowl"></div>
                <button class="btn btn-gold" style="width:100%" id="save-team-btn" onclick="saveTeam()" disabled>Save Team</button>
            </div>
            <div class="player-list-panel">
                <div id="player-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
// --- CONFIGURATION ---
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDL-KwaBrgRCHsxqDNtzs_l4h_dVw6I-FU",
  authDomain: "fantasy-ipl-pacers.firebaseapp.com",
  projectId: "fantasy-ipl-pacers",
  storageBucket: "fantasy-ipl-pacers.firebasestorage.app",
  messagingSenderId: "387034742467",
  appId: "1:387034742467:web:aac26c773af863d540ec76"
};
const CRIC_API_KEY = "11e03482-e61d-4b03-817f-01f331e364ea";

// --- INIT FIREBASE ---
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let userData = null;
let matches = [];
let myTeamIds = [];

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const doc = await db.collection("users").doc(user.uid).get();
    userData = doc.data();
    document.getElementById("nav-username").textContent = userData.fullname || user.email;
    document.getElementById("auth-page").style.display = "none";
    document.getElementById("app-page").style.display = "block";
    loadMatches();
  } else {
    document.getElementById("auth-page").style.display = "flex";
    document.getElementById("app-page").style.display = "none";
  }
});

function doLogin() {
  const e = document.getElementById("login-email").value;
  const p = document.getElementById("login-password").value;
  auth.signInWithEmailAndPassword(e, p).catch(err => {
    document.getElementById("auth-error").textContent = err.message;
    document.getElementById("auth-error").style.display = "block";
  });
}

function doLogout() { auth.signOut(); }

// --- CORE LOGIC ---
async function loadMatches() {
  const res = await fetch(`https://api.cricapi.com/v1/cricScore?apikey=${CRIC_API_KEY}`);
  const data = await res.json();
  matches = (data.data || []).filter(m => m.series_id === "d5a498c8-7596-4b93-8ab0-e0efc3345312" || m.name.includes("IPL"));
  
  const teamSnap = await db.collection("teams").where("userId", "==", currentUser.uid).get();
  myTeamIds = teamSnap.docs.map(d => d.data().matchId);
  
  renderMatches();
}

function renderMatches() {
  const container = document.getElementById("matches-container");
  container.innerHTML = matches.map(m => {
    const isStarted = new Date(m.dateTimeGMT) <= new Date();
    const hasTeam = myTeamIds.includes(m.id);
    return `
      <div class="match-card" onclick="openMatchDetail('${m.id}')">
        <div class="match-header">
          <span style="font-weight:700">${m.name}</span>
          <span class="match-status ${isStarted ? 'status-live' : 'status-upcoming'}">
            ${isStarted ? 'Started' : 'Upcoming'}
          </span>
        </div>
        ${hasTeam ? '<div style="color:var(--green); font-size:0.8rem">✓ Team Submitted</div>' : ''}
      </div>
    `;
  }).join("");
}

async function openMatchDetail(matchId) {
  const match = matches.find(m => m.id === matchId);
  const isStarted = new Date(match.dateTimeGMT) <= new Date();
  document.getElementById("detail-match-title").textContent = match.name;
  document.getElementById("match-detail-overlay").style.display = "flex";

  const teamsSnap = await db.collection("teams").where("matchId", "==", matchId).get();
  let leaderHtml = "";
  if (!teamsSnap.empty) {
    const teams = teamsSnap.docs.map(d => ({id: d.id, ...d.data()}));
    const userIds = [...new Set(teams.map(t => t.userId))];
    const userMap = {};
    await Promise.all(userIds.map(async id => {
        const u = await db.collection("users").doc(id).get();
        userMap[id] = u.data()?.fullname || "Player";
    }));

    leaderHtml = `<table class="leaderboard-table">
        <thead><tr><th>#</th><th>Name</th><th>Pts</th></tr></thead>
        <tbody>
          ${teams.sort((a,b) => b.points - a.points).map((t, i) => `
            <tr onclick="${isStarted ? `viewUserTeam('${t.id}')` : ''}" style="${isStarted ? 'cursor:pointer' : ''}">
              <td>${i+1}</td>
              <td>${userMap[t.userId]} ${isStarted ? '🔍' : ''}</td>
              <td>${t.points || 0}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  const hasTeam = myTeamIds.includes(matchId);
  const btn = (!isStarted) ? `<button class="btn btn-gold" style="width:100%; margin-top:1rem" onclick="openBuilder('${matchId}')">${hasTeam ? "Edit Team" : "Create Team"}</button>` : "";
  
  document.getElementById("match-detail-content").innerHTML = `<div>Status: ${match.status}</div>` + leaderHtml + btn;
}

async function viewUserTeam(teamDocId) {
    const doc = await db.collection("teams").doc(teamDocId).get();
    const data = doc.data();
    alert(`Players: ${data.players.join(', ')}\nCaptain: ${data.captainId}`);
}

function showTab(tab) {
  document.querySelectorAll(".tab-content").forEach(c => c.style.display = "none");
  document.getElementById("tab-" + tab).style.display = "block";
}

// (Team Builder Logic and rest of functions remain the same as your original logic)
function openBuilder(id) {
    document.getElementById("team-builder-overlay").style.display = "block";
}
function closeTeamBuilder() {
    document.getElementById("team-builder-overlay").style.display = "none";
}
</script>
</body>
</html>
