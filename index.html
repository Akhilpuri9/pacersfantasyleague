<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacers Fantasy League 2026</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap');
  :root {
    --bg: #080c14; --bg2: #0d1420; --bg3: #121a2a; --card: #0f1928; --card2: #162135;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --gold: #f0b429; --teal: #00c9a7; --red: #f05252; --green: #22c55e;
    --blue: #60a5fa; --text: #e8edf5; --muted: #6b7a99;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; overflow-x:hidden; }

  nav { background: rgba(13,20,32,0.95); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top:0; z-index:100; }
  .logo { font-family:'Bebas Neue',sans-serif; display:flex; align-items:center; gap:0.75rem; text-decoration:none; color: var(--gold); font-size: 1.5rem; letter-spacing: 2px; }
  .btn { padding:0.5rem 1.25rem; border-radius:8px; border:none; cursor:pointer; font-weight:600; transition:all 0.2s; font-size:0.875rem; }
  .btn-gold { background:var(--gold); color:#000; }
  .btn-outline { background:transparent; border:1px solid var(--border2); color:var(--text); }
  .btn-teal { background:var(--teal); color:#000; }
  .btn-sm { padding:0.3rem 0.9rem; font-size:0.78rem; }
  
  .tabs { display:flex; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; overflow-x: auto; padding: 0 1rem; }
  .tab { padding: 1rem; background: none; border: none; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .match-card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; margin-bottom:1rem; cursor:pointer; }
  .match-status { font-size:0.7rem; padding:0.25rem 0.75rem; border-radius:20px; font-weight:700; text-transform:uppercase; }
  .status-live { background:rgba(34,197,94,0.15); color:var(--green); border:1px solid var(--green); }
  
  .leaderboard-table { width:100%; border-collapse:collapse; margin-top:1rem; }
  .leaderboard-table th { text-align:left; color:var(--muted); font-size:0.75rem; padding:0.5rem; border-bottom:1px solid var(--border); }
  .leaderboard-table td { padding:0.8rem 0.5rem; border-bottom:1px solid var(--border); font-size:0.9rem; }
  
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:200; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--card2); border:1px solid var(--border2); border-radius:18px; padding:1.5rem; width:90%; max-width:500px; }

  .pitch-visual { background:var(--card); border-radius:14px; padding:1.5rem; border:1px solid var(--border); }
  .player-slots { display:flex; flex-wrap:wrap; gap:0.75rem; justify-content:center; }
  .player-avatar { width:48px; height:48px; border-radius:50%; background:var(--bg3); border:2px solid var(--border2); display:flex; align-items:center; justify-content:center; font-size:0.7rem; position:relative; }
  .player-avatar.filled { border-color:var(--teal); }
  .badge-c { position:absolute; top:-5px; right:-5px; background:var(--gold); color:#000; border-radius:50%; width:18px; height:18px; font-size:10px; display:flex; align-items:center; justify-content:center; font-weight:800; }
  
  .toast { position:fixed; bottom:1.5rem; right:1.5rem; background:var(--card2); padding:1rem; border-radius:10px; transform:translateY(150%); transition:transform 0.3s; z-index:1000; border:1px solid var(--gold); }
  .toast.show { transform:translateY(0); }
  .spinner { width:40px; height:40px; border:3px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; margin:2rem auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>

<div id="auth-page" style="display:flex; height:100vh; align-items:center; justify-content:center; background:var(--bg)">
  <div style="background:var(--card); padding:2.5rem; border-radius:20px; width:100%; max-width:400px; border:1px solid var(--border2)">
    <h1 style="font-family:'Bebas Neue'; color:var(--gold); text-align:center; margin-bottom:1rem">PACERS FANTASY 2026</h1>
    <div id="auth-error" style="color:var(--red); font-size:0.8rem; margin-bottom:1rem; text-align:center"></div>
    <input type="email" id="login-email" placeholder="Email" style="width:100%; padding:0.8rem; margin-bottom:1rem; background:var(--bg3); border:1px solid var(--border2); color:white; border-radius:8px">
    <input type="password" id="login-password" placeholder="Password" style="width:100%; padding:0.8rem; margin-bottom:1.5rem; background:var(--bg3); border:1px solid var(--border2); color:white; border-radius:8px">
    <button class="btn btn-gold" style="width:100%" onclick="doLogin()">Login</button>
    <p style="text-align:center; margin-top:1rem; font-size:0.8rem; color:var(--muted)">Don't have an account? Edit the code to enable signup logic.</p>
  </div>
</div>

<div id="app-page" style="display:none">
  <nav>
    <div class="logo">PACERS FANTASY</div>
    <div style="display:flex; align-items:center; gap:1rem">
      <span id="nav-username" style="font-size:0.8rem; color:var(--muted)"></span>
      <button class="btn btn-outline btn-sm" onclick="doLogout()">Sign Out</button>
    </div>
  </nav>

  <div class="tabs">
    <button class="tab active" onclick="showTab('matches')">Matches</button>
    <button class="tab" onclick="showTab('myteams')">My Teams</button>
    <button class="tab" onclick="showTab('leaderboard')">Leaderboard</button>
  </div>

  <div id="tab-matches" style="padding:1rem">
    <div id="matches-container"></div>
  </div>

  <div id="tab-myteams" style="padding:1rem; display:none">
    <div id="myteams-container"></div>
  </div>
</div>

<div id="match-detail-overlay" style="display:none" class="modal-overlay">
  <div class="modal" style="max-width:600px">
    <h2 id="detail-title" style="margin-bottom:1rem; font-family:'Rajdhani'"></h2>
    <div id="detail-content"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:1rem" onclick="closeModal('match-detail-overlay')">Close</button>
  </div>
</div>

<div id="team-builder-overlay" style="display:none; position:fixed; inset:0; background:var(--bg); z-index:300; padding:1rem; overflow-y:auto">
    <button class="btn btn-outline btn-sm" onclick="closeModal('team-builder-overlay')">← Cancel</button>
    <h2 id="builder-title" style="margin:1rem 0"></h2>
    <div id="player-selection-list"></div>
    <button class="btn btn-gold" style="width:100%; margin-top:2rem" onclick="saveTeam()">Save Fantasy Team</button>
</div>

<div id="toast" class="toast"></div>

<script>
// ============================================================
// CONFIGURATION
// ============================================================
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDL-KwaBrgRCHsxqDNtzs_l4h_dVw6I-FU",
  authDomain: "fantasy-ipl-pacers.firebaseapp.com",
  projectId: "fantasy-ipl-pacers",
  storageBucket: "fantasy-ipl-pacers.firebasestorage.app",
  messagingSenderId: "387034742467",
  appId: "1:387034742467:web:aac26c773af863d540ec76"
};
const CRIC_API_KEY = "11e03482-e61d-4b03-817f-01f331e364ea";

// ============================================================
// APP LOGIC
// ============================================================
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let currentMatch = null;
let selectedPlayers = [];

auth.onAuthStateChanged(user => {
  if (user) {
    currentUser = user;
    document.getElementById('auth-page').style.display = 'none';
    document.getElementById('app-page').style.display = 'block';
    db.collection("users").doc(user.uid).get().then(doc => {
        document.getElementById('nav-username').textContent = doc.data()?.fullname || user.email;
    });
    loadMatches();
  } else {
    document.getElementById('auth-page').style.display = 'flex';
    document.getElementById('app-page').style.display = 'none';
  }
});

async function loadMatches() {
  const container = document.getElementById('matches-container');
  container.innerHTML = '<div class="spinner"></div>';
  
  try {
    const res = await fetch(`https://api.cricapi.com/v1/cricScore?apikey=${CRIC_API_KEY}`);
    const data = await res.json();
    const matches = (data.data || []).filter(m => m.series_id === "d5a498c8-7596-4b93-8ab0-e0efc3345312" || m.name.includes("IPL"));
    window._matches = matches;

    const myTeamsSnap = await db.collection("teams").where("userId", "==", currentUser.uid).get();
    const myMatchIds = myTeamsSnap.docs.map(d => d.data().matchId);

    container.innerHTML = matches.map(m => {
      const isStarted = new Date(m.dateTimeGMT) <= new Date();
      const hasTeam = myMatchIds.includes(m.id);
      return `
        <div class="match-card" onclick="openMatchDetail('${m.id}')">
          <div style="display:flex; justify-content:space-between">
            <span style="font-weight:700">${m.name}</span>
            <span class="match-status ${isStarted ? 'status-live' : ''}">${isStarted ? 'Started' : 'Upcoming'}</span>
          </div>
          <div style="margin-top:0.5rem; color:var(--muted); font-size:0.8rem">${new Date(m.dateTimeGMT).toLocaleString()}</div>
          ${hasTeam ? '<div style="color:var(--green); font-size:0.8rem; margin-top:0.5rem">✓ Team Submitted</div>' : ''}
        </div>
      `;
    }).join('');
  } catch(e) { container.innerHTML = "Error loading matches."; }
}

async function openMatchDetail(matchId) {
  const match = window._matches.find(m => m.id === matchId);
  const isStarted = new Date(match.dateTimeGMT) <= new Date();
  currentMatch = match;

  document.getElementById('detail-title').textContent = match.name;
  document.getElementById('match-detail-overlay').style.display = 'flex';

  let html = `<div>Status: ${match.status}</div>`;
  
  // Fetch Leaderboard with Names
  const teamsSnap = await db.collection("teams").where("matchId", "==", matchId).get();
  if (!teamsSnap.empty) {
    const teams = teamsSnap.docs.map(d => ({id: d.id, ...d.data()}));
    const userIds = [...new Set(teams.map(t => t.userId))];
    const userMap = {};
    
    await Promise.all(userIds.map(async id => {
        const u = await db.collection("users").doc(id).get();
        userMap[id] = u.data()?.fullname || "Player";
    }));

    html += `
      <table class="leaderboard-table">
        <thead><tr><th>Rank</th><th>Name</th><th>Pts</th></tr></thead>
        <tbody>
          ${teams.sort((a,b) => b.points - a.points).map((t, i) => `
            <tr onclick="${isStarted ? `viewUserTeam('${t.id}')` : ''}" style="${isStarted ? 'cursor:pointer' : ''}">
              <td>${i+1}</td>
              <td>${userMap[t.userId]} ${isStarted ? '🔍' : ''}</td>
              <td>${t.points || 0}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  }

  if (!isStarted) {
    const myTeam = await db.collection("teams").where("userId", "==", currentUser.uid).where("matchId", "==", matchId).get();
    const btnText = myTeam.empty ? "Create Team" : "Edit Team";
    html += `<button class="btn btn-gold" style="width:100%; margin-top:1rem" onclick="openBuilder('${matchId}')">${btnText}</button>`;
  }

  document.getElementById('detail-content').innerHTML = html;
}

async function viewUserTeam(teamDocId) {
    const doc = await db.collection("teams").doc(teamDocId).get();
    const data = doc.data();
    alert(`Team Players:\n${data.players.join('\n')}\n\nCaptain: ${data.captainId}\nVC: ${data.viceCaptainId}`);
}

async function openBuilder(matchId) {
    document.getElementById('match-detail-overlay').style.display = 'none';
    document.getElementById('team-builder-overlay').style.display = 'block';
    document.getElementById('builder-title').textContent = "Pick Your 11";
    
    // Simplified Mock Players for demo - in production use match_squad endpoint
    const players = [
        {id: "P1", name: "Player A", role: "BAT"}, {id: "P2", name: "Player B", role: "BOWL"},
        {id: "P3", name: "Player C", role: "WK"}, {id: "P4", name: "Player D", role: "AR"},
        {id: "P5", name: "Player E", role: "BAT"}, {id: "P6", name: "Player F", role: "BOWL"},
        {id: "P7", name: "Player G", role: "WK"}, {id: "P8", name: "Player H", role: "AR"},
        {id: "P9", name: "Player I", role: "BAT"}, {id: "P10", name: "Player J", role: "BOWL"},
        {id: "P11", name: "Player K", role: "AR"}, {id: "P12", name: "Player L", role: "BAT"}
    ];

    document.getElementById('player-selection-list').innerHTML = players.map(p => `
        <div style="padding:0.5rem; border-bottom:1px solid #333; display:flex; justify-content:space-between">
            <span>${p.name} (${p.role})</span>
            <input type="checkbox" value="${p.id}" onchange="updateSelected(this)">
        </div>
    `).join('');
}

function updateSelected(cb) {
    if (cb.checked) selectedPlayers.push(cb.value);
    else selectedPlayers = selectedPlayers.filter(id => id !== cb.value);
}

async function saveTeam() {
    if (selectedPlayers.length !== 11) { showToast("Select 11 players", "red"); return; }
    await db.collection("teams").add({
        userId: currentUser.uid,
        matchId: currentMatch.id,
        players: selectedPlayers,
        captainId: selectedPlayers[0],
        viceCaptainId: selectedPlayers[1],
        points: 0
    });
    showToast("Team Saved!", "green");
    location.reload();
}

function showTab(tab) {
    document.querySelectorAll('[id^="tab-"]').forEach(el => el.style.display = 'none');
    document.getElementById('tab-' + tab).style.display = 'block';
}

function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function showToast(m, c) {
    const t = document.getElementById('toast');
    t.textContent = m; t.style.borderColor = c; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function doLogin() {
    const e = document.getElementById('login-email').value;
    const p = document.getElementById('login-password').value;
    auth.signInWithEmailAndPassword(e, p).catch(err => document.getElementById('auth-error').textContent = err.message);
}

function doLogout() { auth.signOut(); }
</script>
</body>
</html>
