<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacers Fantasy League</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&family=Rajdhani:wght@400;500;600;700&display=swap');
  :root {
    --bg: #080c14; --bg2: #0d1420; --bg3: #121a2a;
    --card: #0f1928; --card2: #162135;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --gold: #f0b429; --gold2: #d99f1e;
    --teal: #00c9a7; --red: #f05252; --green: #22c55e;
    --text: #e8edf5; --muted: #6b7a99;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; min-height:100vh; }
  nav { background: rgba(13,20,32,0.95); padding: 0 2rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top:0; z-index:100; border-bottom: 1px solid var(--border); }
  .logo { font-family:'Bebas Neue',sans-serif; letter-spacing:2px; color:var(--gold); font-size:1.5rem; text-decoration:none; }
  .btn { padding:0.5rem 1.25rem; border-radius:8px; border:none; cursor:pointer; font-weight:600; transition:0.2s; }
  .btn-gold { background:var(--gold); color:#000; }
  .btn-outline { background:transparent; border:1px solid var(--border2); color:var(--text); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:1.25rem; margin-bottom:1rem; }
  .leaderboard-table { width:100%; border-collapse:collapse; margin-top:1rem; }
  .leaderboard-table th, .leaderboard-table td { padding:0.75rem; text-align:left; border-bottom:1px solid var(--border); }
  .clickable-user { color:var(--teal); text-decoration:underline; cursor:pointer; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1000; display:none; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .modal { background:var(--card2); padding:2rem; border-radius:18px; max-width:400px; width:90%; }
  .pitch-small { background: #1a2a1a; border: 2px solid #2e4a2e; border-radius: 10px; padding: 10px; margin: 10px 0; }
  .player-pill { background: rgba(255,255,255,0.05); padding: 4px 8px; margin: 2px; border-radius: 4px; font-size: 0.8rem; display: inline-block; }
</style>
</head>
<body>

<nav>
  <a href="#" class="logo" onclick="showDashboard()">PACERS FANTASY</a>
  <div id="nav-user-info" style="font-size:0.9rem;"></div>
</nav>

<div id="app-content" style="max-width:1200px; margin:0 auto; padding:2rem;">
  </div>

<div id="team-modal-overlay" class="modal-overlay">
  <div class="modal">
    <h3 id="modal-title" style="color:var(--gold); margin-bottom:1rem;"></h3>
    <div id="modal-team-list" class="pitch-small"></div>
    <button class="btn btn-outline" style="width:100%; margin-top:1rem;" onclick="closeTeamModal()">Close</button>
  </div>
</div>

<script>
// REPLACE WITH YOUR ACTUAL FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_ID",
  appId: "YOUR_APP_ID"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();

let currentUser = null;
let currentUserData = null;

// Auth State
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const userDoc = await db.collection("users").doc(user.uid).get();
    currentUserData = userDoc.exists ? userDoc.data() : { name: "Player", username: "player" };
    document.getElementById("nav-user-info").innerHTML = `Logged as: <strong>${currentUserData.name}</strong>`;
    showDashboard();
  } else {
    showLogin();
  }
});

function showDashboard() {
  document.getElementById("app-content").innerHTML = `
    <h2 style="margin-bottom:1.5rem;">Matches</h2>
    <div id="matches-container">Loading...</div>
  `;
  fetchMatches();
}

async function fetchMatches() {
  // Demo Match Data
  const matches = [
    { id: "ipl_1", teams: "CSK vs RCB", dateTimeGMT: new Date(Date.now() + 3600000).toISOString() }, // Future
    { id: "ipl_2", teams: "MI vs KKR", dateTimeGMT: new Date(Date.now() - 3600000).toISOString() }   // Started
  ];
  
  const container = document.getElementById("matches-container");
  container.innerHTML = matches.map(m => {
    const isLive = new Date() > new Date(m.dateTimeGMT);
    return `
      <div class="card" style="cursor:pointer;" onclick="viewMatchDetails('${m.id}', '${m.teams}', '${m.dateTimeGMT}')">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:bold; font-size:1.1rem;">${m.teams}</div>
            <div style="font-size:0.8rem; color:var(--muted)">${new Date(m.dateTimeGMT).toLocaleString()}</div>
          </div>
          <span style="color:${isLive ? 'var(--green)' : 'var(--gold)'}; font-weight:bold;">${isLive ? 'LIVE/FINISHED' : 'UPCOMING'}</span>
        </div>
      </div>
    `;
  }).join('');
}

async function viewMatchDetails(id, teams, time) {
  const matchTime = new Date(time);
  const isStarted = new Date() > matchTime;

  document.getElementById("app-content").innerHTML = `
    <button class="btn btn-outline" onclick="showDashboard()" style="margin-bottom:1rem;">← Back</button>
    <div class="card">
      <h2>${teams}</h2>
      <p style="color:var(--muted); margin-bottom:1rem;">Match Time: ${matchTime.toLocaleString()}</p>
      
      ${!isStarted ? 
        `<button class="btn btn-gold" onclick="alert('Opening Team Editor for ${id}...')">Edit Team</button>` : 
        `<div style="color:var(--red); font-weight:500;"><i class="fas fa-lock"></i> Match started. Team editing is locked.</div>`
      }
    </div>

    <div class="card">
      <h3>Match Leaderboard</h3>
      <table class="leaderboard-table">
        <thead>
          <tr><th>Rank</th><th>Player</th><th>Points</th></tr>
        </thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  `;
  loadLeaderboard(id, isStarted);
}

async function loadLeaderboard(matchId, isStarted) {
  // Demo Leaderboard Data
  const leaderboardData = [
    { uid: "user_1", name: "Akhil Puri", points: 245 },
    { uid: "user_2", name: "Sahil Puri", points: 210 }
  ];

  const tbody = document.getElementById("leaderboard-body");
  
  // MODIFICATION 1: Use user.name instead of user.username
  // MODIFICATION 3: Enable click-to-view if match started
  tbody.innerHTML = leaderboardData.map((u, idx) => `
    <tr>
      <td>${idx + 1}</td>
      <td class="${isStarted ? 'clickable-user' : ''}" 
          onclick="${isStarted ? `viewUserTeam('${u.uid}', '${u.name}', '${matchId}')` : `alert('You can see opponents teams once the match starts!')`}">
        ${u.name} 
      </td>
      <td>${u.points}</td>
    </tr>
  `).join('');
}

async function viewUserTeam(uid, name, matchId) {
  // Fetch specific team from Firestore
  // Document ID pattern: matchID_userID
  const teamDoc = await db.collection("teams").doc(`${matchId}_${uid}`).get();
  const modalList = document.getElementById("modal-team-list");
  document.getElementById("modal-title").innerText = `${name}'s Squad`;
  
  if (teamDoc.exists) {
    const players = teamDoc.data().players || [];
    modalList.innerHTML = players.map(p => `<div class="player-pill">${p}</div>`).join('');
  } else {
    modalList.innerHTML = "<div style='padding:20px; text-align:center;'>No team submitted by this user.</div>";
  }
  
  document.getElementById("team-modal-overlay").style.display = "flex";
}

function closeTeamModal() {
  document.getElementById("team-modal-overlay").style.display = "none";
}

function showLogin() {
  document.getElementById("app-content").innerHTML = `
    <div class="card" style="text-align:center; padding:3rem;">
       <h3>Welcome to Pacers Fantasy</h3>
       <p style="margin:1rem 0; color:var(--muted)">Please sign in to continue</p>
       <button class="btn btn-gold" onclick="alert('Firebase Auth Trigger')">Sign In with Google</button>
    </div>
  `;
}
</script>
</body>
</html>
